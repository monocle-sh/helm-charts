name: Release

# Releases every chart whose `Chart.yaml` version has no `<chart>-<version>` tag yet: bump the
# version in a pull request, merge it, and this workflow publishes the chart to
# oci://ghcr.io/monocle-sh/charts/<chart>, then tags the commit and creates a GitHub release.
on:
  push:
    branches: [main]
    paths: ["charts/**"]
  workflow_dispatch:

# One release run at a time, so two merges never publish the same version twice.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Release new chart versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GH_TOKEN}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts

          for dir in charts/*/; do
            chart=$(helm show chart "$dir" | awk '/^name:/ { print $2 }')
            version=$(helm show chart "$dir" | awk '/^version:/ { print $2 }')
            tag="${chart}-${version}"
            if git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
              echo "${tag} is already released"
              continue
            fi

            echo "Releasing ${tag}"
            helm dependency build "$dir"
            helm lint --strict "$dir" -f "$dir/ci/values.yaml"
            helm package "$dir" --destination dist
            helm push "dist/${tag}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
            gh release create "${tag}" --target "${GITHUB_SHA}" --title "${tag}" --generate-notes \
              --notes "Install: \`helm install <release> oci://ghcr.io/${{ github.repository_owner }}/charts/${chart} --version ${version}\`" \
              "dist/${tag}.tgz"
          done
