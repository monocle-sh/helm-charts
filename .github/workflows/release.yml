name: Release

# A chart is released by pushing a `<chart>-<version>` tag, such as `monocle-k8s-agent-0.2.0`,
# on a commit of `main` whose `charts/<chart>/Chart.yaml` has that version.
on:
  push:
    tags:
      - "*-[0-9]*"

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history, so the tagged commit can be checked against main.
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Check the tag
        run: |
          # The version starts at the last dash followed by `<major>.<minor>.<patch>`, so
          # pre-releases such as `monocle-k8s-agent-0.3.0-rc.1` split right.
          chart=$(echo "${GITHUB_REF_NAME}" | sed -E 's/^(.+)-([0-9]+\.[0-9]+\.[0-9]+.*)$/\1/')
          version="${GITHUB_REF_NAME#"${chart}-"}"
          if [ ! -f "charts/${chart}/Chart.yaml" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} names no chart: charts/${chart} does not exist"
            exit 1
          fi
          chart_version=$(helm show chart "charts/${chart}" | awk '/^version:/ { print $2 }')
          if [ "${version}" != "${chart_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match ${chart} version ${chart_version}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points to ${GITHUB_SHA}, which is not on main"
            exit 1
          fi
          echo "CHART=${chart}" >> "$GITHUB_ENV"

      - name: Package
        run: |
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm dependency build "charts/${CHART}"
          helm package "charts/${CHART}" --destination dist

      # Pushes ghcr.io/monocle-sh/charts/<chart>:<version>.
      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push dist/*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"
