# Monocle connection. The collectors read the key from the Secret named in `global.secret`, and the
# endpoint and cluster name from the `monocle-k8s-agent` ConfigMap.
monocle:
  # Set to false to provide the Secret yourself, under the name and key set in `global.secret`:
  # created with kubectl, or synced from a secret manager so it stays out of Git.
  # `monocle.apiKey` is then ignored.
  createSecret: true
  # Key of this cluster, from "Connect a cluster" on Monocle's Kubernetes page. Cluster data
  # belongs to your organization, not to a project or an environment. Required unless
  # `createSecret` is false.
  apiKey: ""
  # Monocle OTLP/HTTP ingestion endpoint.
  endpoint: https://ingest.monocle.sh
  # Name of this cluster in Monocle, as given when connecting it. Required.
  clusterName: ""

# Options read by both collectors. Helm shares only `global` with the `agent` and `cluster` charts.
global:
  # Secret that holds the cluster key. The chart creates it unless `monocle.createSecret` is false.
  secret:
    name: monocle-k8s-agent
    key: apiKey
  # Container logs read by the agent on each node.
  logs:
    # Namespaces whose logs are skipped.
    excludeNamespaces: [kube-system]
    # When set, only these namespaces are read.
    includeNamespaces: []
    # Pods whose logs are skipped, as glob patterns on the pod name, such as `debug-*`.
    excludePods: []
    # Containers whose logs are skipped, as glob patterns on the container name, such as `istio-proxy`.
    excludeContainers: []
    # Lines dropped on the node, as regular expressions on the line, such as `^GET /healthz`.
    dropPatterns: []
    # Drops lines below this level: debug, info, warn, error or fatal. Lines whose level the agent
    # cannot find are kept.
    minSeverity: ""
    # Joins indented lines, `Caused by:` and `... N more` to the line above, so a stack trace is
    # one log record.
    multiline: true
  metrics:
    # Scrapes the Prometheus metrics of pods annotated `prometheus.io/scrape: "true"`, on the port
    # and path of their `prometheus.io/port` and `prometheus.io/path` annotations.
    prometheusScrape: false

# Node agent: kubelet metrics, container logs, and OTLP from workloads on the node.
# Workloads send OTLP to the agent on their node with their own Monocle API key and environment
# headers, as they would to Monocle; the agent adds Kubernetes metadata and forwards each request
# with those headers only. They reach it through the agent Service, or on the node's host ports
# 4317/4318 (status.hostIP) with their pod IP in k8s.pod.ip.
agent:
  enabled: true
  mode: daemonset
  # The upstream chart gives a DaemonSet's Service `internalTrafficPolicy: Local`: each pod reaches
  # the agent on its own node, which sees the pod's IP and adds that pod's metadata. Host ports
  # often hide it. A node whose agent is not running drops its workloads' telemetry.
  service:
    enabled: true
  image:
    repository: otel/opentelemetry-collector-contrib
  command:
    name: otelcol-contrib
  presets:
    kubernetesAttributes:
      enabled: true
    kubeletMetrics:
      enabled: true
    logsCollection:
      enabled: true
  extraEnvs:
    - &apiKeyEnv
      name: MONOCLE_API_KEY
      valueFrom:
        secretKeyRef:
          name: '{{ include "monocle-k8s-agent.secretName" . }}'
          key: '{{ include "monocle-k8s-agent.secretKey" . }}'
    - &endpointEnv
      name: MONOCLE_ENDPOINT
      valueFrom:
        configMapKeyRef:
          name: monocle-k8s-agent
          key: endpoint
    - &clusterNameEnv
      name: K8S_CLUSTER_NAME
      valueFrom:
        configMapKeyRef:
          name: monocle-k8s-agent
          key: clusterName
    # `global.logs` and `global.metrics`, rendered for the config below.
    - name: MONOCLE_LOGS_INCLUDE
      value: '{{ include "monocle-k8s-agent.logs.include" . }}'
    - name: MONOCLE_LOGS_EXCLUDE
      value: '{{ include "monocle-k8s-agent.logs.exclude" . }}'
    - name: MONOCLE_LOGS_DROP
      value: '{{ include "monocle-k8s-agent.logs.drop" . }}'
    - name: MONOCLE_LOGS_MULTILINE
      value: '{{ .Values.global.logs.multiline }}'
    - name: MONOCLE_LOGS_SEVERITY
      value: '{{ not (empty .Values.global.logs.minSeverity) }}'
    - name: MONOCLE_PROMETHEUS_RECEIVER
      value: '{{ ternary "prometheus/annotations" "nop" .Values.global.metrics.prometheusScrape }}'
  ports: &ports
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
  # Limit and request utilization need pod specs from the kubelet; the preset only grants nodes/stats.
  # Kubernetes 1.33+ checks nodes/pods. Older versions check nodes/proxy, which also allows exec into
  # any pod through the kubelet, so they are not supported.
  clusterRole:
    rules:
      - apiGroups: [""]
        resources: [nodes/pods]
        verbs: [get]
  # Run on every node, including tainted control-plane nodes.
  tolerations:
    - operator: Exists
  # Read positions of container log files, kept on the node so a restarted or upgraded agent
  # resumes where it stopped instead of skipping the lines written meanwhile. The collector runs as
  # user 10001; the init container only gives it this directory.
  initContainers:
    - name: log-positions
      image: busybox:1.37
      command:
        - chown
        - '{{ .Values.securityContext.runAsUser | default 10001 }}:0'
        - /var/lib/monocle-k8s-agent
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 16Mi
      volumeMounts:
        - name: log-positions
          mountPath: /var/lib/monocle-k8s-agent
  extraVolumes:
    - name: log-positions
      hostPath:
        path: /var/lib/monocle-k8s-agent
        type: DirectoryOrCreate
  extraVolumeMounts:
    - name: log-positions
      mountPath: /var/lib/monocle-k8s-agent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  config:
    extensions:
      file_storage:
        directory: /var/lib/monocle-k8s-agent
      headers_setter: &clusterHeaders
        headers:
          - action: upsert
            key: x-api-key
            value: ${env:MONOCLE_API_KEY}
      # Forwards the API key and environment the workload sent, with no fallback: a request
      # without them is refused by Monocle instead of being sent with the cluster's key.
      headers_setter/workloads:
        headers:
          - action: upsert
            key: x-api-key
            from_context: x-api-key
          - action: upsert
            key: x-monocle-env
            from_context: x-monocle-env
    receivers:
      jaeger: null
      zipkin: null
      prometheus: null
      # Stands in for `prometheus/annotations` when `global.metrics.prometheusScrape` is false.
      nop: {}
      # Merged into the logsCollection preset.
      file_log:
        include: ${env:MONOCLE_LOGS_INCLUDE}
        exclude: ${env:MONOCLE_LOGS_EXCLUDE}
        storage: file_storage
        operators:
          - type: container
            id: container-parser
            max_log_size: 102400
          - type: recombine
            id: multiline
            if: ${env:MONOCLE_LOGS_MULTILINE}
            combine_field: body
            source_identifier: attributes["log.file.path"]
            is_first_entry: body matches "^\\S" and not (body matches "^(Caused by:|\\.\\.\\. \\d+ more)")
            force_flush_period: 1s
            max_log_size: 102400
          # For `global.logs.minSeverity`: the first `level`, `lvl` or `severity` field of a JSON or
          # logfmt line sets the record's level. Container runtimes record none.
          - type: regex_parser
            id: severity
            if: ${env:MONOCLE_LOGS_SEVERITY}
            regex: '(?i)\b(?:level|lvl|severity)"?\s*[:=]\s*"?(?P<monocle_level>trace|debug|info|warn|warning|error|fatal)\b'
            on_error: send_quiet
            severity:
              parse_from: attributes.monocle_level
          - type: remove
            if: attributes.monocle_level != nil
            field: attributes.monocle_level
      # Pods on this node annotated `prometheus.io/scrape: "true"`.
      prometheus/annotations:
        config:
          scrape_configs:
            - job_name: kubernetes-pods
              scrape_interval: 60s
              # Caps the series of one pod, which all count toward the organization's usage.
              sample_limit: 10000
              # Pods serve their own certificates, which do not name their IP.
              tls_config:
                insecure_skip_verify: true
              kubernetes_sd_configs:
                - role: pod
                  selectors:
                    - role: pod
                      field: spec.nodeName=${env:K8S_NODE_NAME}
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  regex: "true"
                  action: keep
                - source_labels: [__meta_kubernetes_pod_phase]
                  regex: Pending|Succeeded|Failed
                  action: drop
                - source_labels: [__meta_kubernetes_pod_container_init]
                  regex: "true"
                  action: drop
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
                  regex: (https?)
                  target_label: __scheme__
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  regex: (.+)
                  target_label: __metrics_path__
                - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $$1:$$2
                  target_label: __address__
      otlp:
        protocols:
          grpc:
            include_metadata: true
          http:
            include_metadata: true
      kubeletstats:
        # 60s halves the stored points compared to 30s; Monocle charts use 1-minute buckets at most.
        collection_interval: 60s
        # Set to true only for kubelets with self-signed certificates without IP SANs (kind, minikube).
        insecure_skip_verify: false
        # Percentages of pod requests and limits are what Monocle shows; they are off upstream.
        metrics:
          k8s.pod.cpu_limit_utilization:
            enabled: true
          k8s.pod.cpu_request_utilization:
            enabled: true
          k8s.pod.memory_limit_utilization:
            enabled: true
          k8s.pod.memory_request_utilization:
            enabled: true
          # Unused by Monocle: inode counts and minor page faults.
          k8s.volume.inodes:
            enabled: false
          k8s.volume.inodes.free:
            enabled: false
          k8s.volume.inodes.used:
            enabled: false
          container.memory.page_faults:
            enabled: false
          k8s.pod.memory.page_faults:
            enabled: false
          k8s.node.memory.page_faults:
            enabled: false
        # Monocle reads no per-container kubelet metric: limits, requests and restarts come from
        # the cluster collector. The volume group adds k8s.volume.available/capacity per volume.
        metric_groups: [node, pod, volume]
        # Sets k8s.volume.type, and k8s.persistentvolumeclaim.name on claim volumes, from the pod spec.
        extra_metadata_labels: [k8s.volume.type]
    processors:
      <<: &processors
        # The preset also derives service.* from pod labels, which would turn every workload
        # (kindnet, nginx, ...) into a Monocle service. Workloads are linked by k8s.* attributes instead.
        k8s_attributes:
          extract:
            metadata:
              - k8s.namespace.name
              - k8s.pod.name
              - k8s.pod.uid
              - k8s.pod.start_time
              - k8s.node.name
              - k8s.deployment.name
              - k8s.replicaset.name
              - k8s.statefulset.name
              - k8s.daemonset.name
              - k8s.job.name
              - k8s.cronjob.name
              - k8s.container.name
              - container.image.name
            # Pods annotated `monocle.sh/logs: "false"` opt out of container log collection.
            annotations:
              - tag_name: monocle.logs
                key: monocle.sh/logs
                from: pod
        resource/cluster:
          attributes:
            - key: k8s.cluster.name
              value: ${env:K8S_CLUSTER_NAME}
              action: upsert
            # Read by `filter/logs` only.
            - key: monocle.logs
              action: delete
        # Config and token volumes report the size of the node disk, not their own, and Monocle
        # ignores them. Projected volumes have no k8s.volume.type, so service account tokens match by name.
        filter/config_volumes:
          error_mode: ignore
          metric_conditions:
            - >-
              IsMatch(metric.name, "^k8s\\.volume\\.") and
              (resource.attributes["k8s.volume.type"] == "configMap" or
              resource.attributes["k8s.volume.type"] == "secret" or
              resource.attributes["k8s.volume.type"] == "downwardAPI" or
              IsMatch(resource.attributes["k8s.volume.name"], "^kube-api-access-"))
        # Keep one batch per sender so each keeps its own API key.
        batch/workloads:
          metadata_keys: [x-api-key, x-monocle-env]
          metadata_cardinality_limit: 100
      # Scraped pods are linked by k8s.* attributes, like every workload, not turned into services
      # named after the scrape job.
      resource/prometheus:
        attributes:
          - key: service.name
            action: delete
          - key: service.instance.id
            action: delete
      # Container log lines dropped by `global.logs`, before they leave the node.
      filter/logs:
        error_mode: ignore
        log_conditions: ${env:MONOCLE_LOGS_DROP}
    exporters:
      debug: null
      otlphttp/monocle: &monocleExporter
        endpoint: ${env:MONOCLE_ENDPOINT}
        auth:
          authenticator: headers_setter
      otlphttp/workloads:
        endpoint: ${env:MONOCLE_ENDPOINT}
        auth:
          authenticator: headers_setter/workloads
    service:
      extensions: [health_check, file_storage, headers_setter, headers_setter/workloads]
      # memory_limiter comes first so data is refused before any work is done on it. Listing
      # k8s_attributes stops the kubernetesAttributes preset from prepending it. The presets add
      # kubeletstats to `metrics` and filelog to `logs`, which send with the cluster's key; the
      # `*/workloads` pipelines carry OTLP from workloads with their own.
      pipelines:
        traces: null
        metrics:
          receivers: []
          processors:
            [memory_limiter, filter/config_volumes, k8s_attributes, resource/cluster, batch]
          exporters: [otlphttp/monocle]
        metrics/prometheus:
          receivers: ["${env:MONOCLE_PROMETHEUS_RECEIVER}"]
          processors: [memory_limiter, k8s_attributes, resource/prometheus, resource/cluster, batch]
          exporters: [otlphttp/monocle]
        logs:
          receivers: []
          processors: [memory_limiter, k8s_attributes, filter/logs, resource/cluster, batch]
          exporters: [otlphttp/monocle]
        traces/workloads:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, resource/cluster, batch/workloads]
          exporters: [otlphttp/workloads]
        metrics/workloads:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, resource/cluster, batch/workloads]
          exporters: [otlphttp/workloads]
        logs/workloads:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, resource/cluster, batch/workloads]
          exporters: [otlphttp/workloads]

# Cluster collector: cluster state and Kubernetes events. Runs as a single replica.
cluster:
  enabled: true
  mode: deployment
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-contrib
  command:
    name: otelcol-contrib
  presets:
    kubernetesAttributes:
      enabled: true
    clusterMetrics:
      enabled: true
    kubernetesEvents:
      enabled: true
      useK8sEventsReceiver: true
  extraEnvs: [*apiKeyEnv, *endpointEnv, *clusterNameEnv]
  # Receives nothing over the network.
  service:
    enabled: false
  ports:
    <<: *ports
    otlp:
      enabled: false
    otlp-http:
      enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  config:
    extensions:
      headers_setter: *clusterHeaders
    receivers:
      jaeger: null
      zipkin: null
      prometheus: null
      otlp: null
      k8s_cluster:
        collection_interval: 60s
        node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure]
        allocatable_types_to_report: [cpu, memory]
        # Container status reasons are what Monocle turns into diagnoses (crash loops, OOM, image pulls).
        metrics:
          k8s.container.status.reason:
            enabled: true
        resource_attributes:
          k8s.container.status.last_terminated_reason:
            enabled: true
    processors: *processors
    exporters:
      debug: null
      otlphttp/monocle: *monocleExporter
    service:
      extensions: [health_check, headers_setter]
      pipelines:
        traces: null
        metrics:
          receivers: []
          processors: [memory_limiter, k8s_attributes, resource/cluster, batch]
          exporters: [otlphttp/monocle]
        logs:
          receivers: []
          processors: [memory_limiter, k8s_attributes, resource/cluster, batch]
          exporters: [otlphttp/monocle]
