{{- /* Both collectors read the key from this Secret, named in `global.secret`. */ -}}
{{- if .Values.monocle.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "monocle-k8s-agent.secretName" . }}
  labels:
    app.kubernetes.io/name: monocle-k8s-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  {{ include "monocle-k8s-agent.secretKey" . | quote }}: {{ required "monocle.apiKey is required, or set monocle.createSecret=false" .Values.monocle.apiKey | quote }}
{{- end }}
