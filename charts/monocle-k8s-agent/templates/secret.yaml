{{- /* Both collectors read their connection settings from this Secret, under a fixed name. */ -}}
{{- if .Values.monocle.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: monocle-k8s-agent
  labels:
    app.kubernetes.io/name: monocle-k8s-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  apiKey: {{ required "monocle.apiKey is required" .Values.monocle.apiKey | quote }}
  environment: {{ required "monocle.environment is required" .Values.monocle.environment | quote }}
  endpoint: {{ required "monocle.endpoint is required" .Values.monocle.endpoint | quote }}
  clusterName: {{ required "monocle.clusterName is required" .Values.monocle.clusterName | quote }}
{{- end }}
