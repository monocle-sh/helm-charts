{{- /* Both collectors read the key from this Secret, under a fixed name. */ -}}
{{- if .Values.monocle.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: monocle-k8s-agent
  labels:
    app.kubernetes.io/name: monocle-k8s-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  apiKey: {{ required "monocle.apiKey is required, or set monocle.createSecret=false" .Values.monocle.apiKey | quote }}
{{- end }}
